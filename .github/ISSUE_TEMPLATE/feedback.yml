name: Feedback
description: What worked, what was confusing, what you need
body:
  - type: markdown
    attributes:
      value: This issue is public. Please leave out personal details and private recordings.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked or got in the way?
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What would make this better?
  - type: input
    id: version
    attributes:
      label: Yapcam version
      description: Yapcam ▸ About Yapcam (e.g. 0.11.0 (937))
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      placeholder: "MacBook Air M2, macOS 15.6"
  - type: input
    id: found
    attributes:
      label: How did you find Yapcam?
      description: Just the place, for example X, Hacker News, Reddit, a friend.
